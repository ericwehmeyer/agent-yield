TION THAT MATTERS, and the bar missed it: the baton found 4 mismatches in both replicates, the reader 8 in both, and the reader's findings are close to a superset rather than a different judgment call -- two of the four the baton missed twice were verified by hand and are real defects. Per DEFECT FOUND the reader is 1.17x cheaper (177,823 against 208,208) and the headline reverses. The pre-registered volume bar was written on CLAIMS COUNTED, the denominator, when the output of the task is MISMATCHES: it would have passed a baton arm that returned zero defects with a full set of claim counts. That is the same failure as #26 and #32 one file over -- the test written to the shape of the work rather than to the point of it. So #33 answers cost and opens #47: does splitting a task across agents systematically find less? Limits: one task, one machine, 19 files that batch cleanly, five tail turns, n=2. The tail ran as one `claude -p --resume` per turn, so every turn pays a cache re-creation an uninterrupted session would not; charged to both arms in proportion to what they carry, which is the quantity under test, but it flatters both absolute numbers. Four runs cost $11.54."
name   = "#33 the end-to-end number: ONE task -- audit the module docstring of all 19 modules in src/agent_yield against their own code -- run in two arms and then continued for five IDENTICAL follow-up turns. Arm BATON: the parent may not open a single file under src/ and must dispatch agents to read; packing is the parent's call. Arm READER: the parent does the whole audit itself and may not dispatch at all. Same model, same flags, same task text, same tail; the arm paragraph is the only difference. The number scored is TOTAL tokens end to end -- every call in the parent's transcript plus every call in every agent transcript that session started -- measured by this repo's own CallRecord loader, snapshotted after every turn because subagent transcripts are volatile. Two replicates per arm, run BATON first so any prompt-cache warmth works against the hypothesis"
