# Process changes, on the record, each with a prediction attached.
#
# `expect` is required and is enforced at load time. An intervention recorded
# without a prediction is not an experiment -- the whole point is to be able to
# be wrong on the record, in public, later.
#
# Write the prediction so a reader in two weeks can say "that happened" or "that
# did not happen" without arguing about what was meant. Vague expectations are
# unfalsifiable and therefore worthless here.

[[intervention]]
date   = "2026-08-25"
name   = "brief-pack: dispatch by line range, agents forbidden to explore the repo"
expect = "subagent context-per-call falls from the measured 89,721 median to under 30,000"

[[intervention]]
date   = "2026-08-25"
name   = "central commits: agents write files and run their own tests, the parent verifies and commits named paths"
expect = "commits per day rises while tokens per commit falls, because parallel work stops serialising on one writer"

[[intervention]]
date   = "2026-08-25"
name   = "persisted ingest: analysis reads .agent-yield/calls.jsonl instead of the volatile OS temp tree"
expect = "the number of subagent transcripts readable for a past day stops falling week over week"

[[intervention]]
date   = "2026-08-25"
name   = "self-contained plan: every task carries literal code, exact paths, and its own interfaces"
expect = "dispatched agents make under 20 tool calls each, against the 62-188 range on record"

[[intervention]]
date   = "2026-08-26"
name   = "handoff before boundary: agent-yield handoff written at every session end, and the boundary cleared by writing it"
expect = "a session started from a handoff opens under 60,000 context/call and its first ten calls cost less than the last ten of the session it replaced"

[[intervention]]
date   = "2026-08-26"
name   = "cost thresholds: a level family at 20%/40% of window, separate from the capacity family"
expect = "the share of calls made above 200K context falls below the measured 20%, and the share of the cache-read bill above 200K falls below the measured 47%"

[[intervention]]
date   = "2026-08-26"
name   = "cost thresholds in absolute tokens: dispatch 300,000, restart 500,000, stop 700,000, each recorded with the share of main-thread calls it fires on"
expect = "the two leave bands fire on under 15% of main-thread calls, and neither the boundary nor the status line is disabled or overridden in the next two weeks -- a threshold that fires on half of everything gets turned off, which is the failure this replaced (the 2026-08-25 family above fired on 42-50%)"

[[intervention]]
date   = "2026-08-26"
name   = "dispatch rubric: every briefed dispatch carries line ranges plus a prohibition on exploring, one unit of work, a named output path, and a return contract"
expect = "over the next 20 non-exploratory dispatches, those whose prompts carry all three detectable markers hold a median of 27 or fewer tool calls and 67,123 or less context/call -- the briefed range on record; a median above 40 calls or 85,000 context/call means the markers are cargo cult and the pre-dispatch half of this should be retracted, keeping only the post-hoc audit"
