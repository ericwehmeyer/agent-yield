# Process changes, on the record, each with a prediction attached.
#
# `expect` is required and is enforced at load time. An intervention recorded
# without a prediction is not an experiment -- the whole point is to be able to
# be wrong on the record, in public, later.
#
# Write the prediction so a reader in two weeks can say "that happened" or "that
# did not happen" without arguing about what was meant. Vague expectations are
# unfalsifiable and therefore worthless here.

[[intervention]]
date   = "2026-08-25"
name   = "brief-pack: dispatch by line range, agents forbidden to explore the repo"
expect = "subagent context-per-call falls from the measured 89,721 median to under 30,000"

[[intervention]]
date   = "2026-08-25"
name   = "central commits: agents write files and run their own tests, the parent verifies and commits named paths"
expect = "commits per day rises while tokens per commit falls, because parallel work stops serialising on one writer"

[[intervention]]
date   = "2026-08-25"
name   = "persisted ingest: analysis reads .agent-yield/calls.jsonl instead of the volatile OS temp tree"
expect = "the number of subagent transcripts readable for a past day stops falling week over week"

[[intervention]]
date   = "2026-08-25"
name   = "self-contained plan: every task carries literal code, exact paths, and its own interfaces"
expect = "dispatched agents make under 20 tool calls each, against the 62-188 range on record"

[[intervention]]
date   = "2026-08-26"
name   = "handoff before boundary: agent-yield handoff written at every session end, and the boundary cleared by writing it"
expect = "a session started from a handoff opens under 60,000 context/call and its first ten calls cost less than the last ten of the session it replaced"

[[intervention]]
date   = "2026-08-26"
name   = "cost thresholds: a level family at 20%/40% of window, separate from the capacity family"
expect = "the share of calls made above 200K context falls below the measured 20%, and the share of the cache-read bill above 200K falls below the measured 47%"

[[intervention]]
date   = "2026-08-26"
name   = "cost thresholds in absolute tokens: dispatch 300,000, restart 500,000, stop 700,000, each recorded with the share of main-thread calls it fires on"
expect = "the two leave bands fire on under 15% of main-thread calls, and neither the boundary nor the status line is disabled or overridden in the next two weeks -- a threshold that fires on half of everything gets turned off, which is the failure this replaced (the 2026-08-25 family above fired on 42-50%)"

[[intervention]]
date   = "2026-08-26"
name   = "dispatch rubric: every briefed dispatch carries line ranges plus a prohibition on exploring, one unit of work, a named output path, and a return contract"
expect = "over the next 20 non-exploratory dispatches, those whose prompts carry all three detectable markers hold a median of 27 or fewer tool calls and 67,123 or less context/call -- the briefed range on record; a median above 40 calls or 85,000 context/call means the markers are cargo cult and the pre-dispatch half of this should be retracted, keeping only the post-hoc audit"

[[intervention]]
date   = "2026-08-26"
name   = "SessionStart loads the handoff: the whole file injected once on startup or clear, consumed by archiving it, never if older than 24h"
result = "VOID, not passed -- scored 2026-08-25 by the next session. The hook never fired: it read `session_start_reason`, and the harness names the reason in `source`, so every start took the fail-open path and injected nothing. The archive was NOT consumed. The session did open at 48,744 context/call (under 60,000) and its first calls were cheap, but it received no treatment, so those numbers are evidence about a fresh session, not about the handoff loader -- reading them as a pass would be confirming a mechanism that did not run. Key fixed and pinned to a captured payload; the prediction is re-armed and still unscored. || RE-ARMED RUN SCORED 2026-08-25 by the session it treated (6e63edd1): PASS on all three legs, and this time the treatment demonstrably ran -- `.agent-yield/resume-probe.jsonl` carries decision=injected, has_reason_key=true, source=startup, injected_chars=5993 against a handoff 1.4 minutes old, and `.agent-yield/handoff.md.loaded` exists, so the archive was consumed. Opening 44,516 context/call against the 60,000 bound; 449,515 tokens over the first ten calls against the 1,420,000 bound, 3.2x under, at 44,951/call against the 142,097/call the replaced session averaged over its last ten. READ THIS BEFORE QUOTING ANY OF IT: the prediction passes exactly as written and no further. The VOID run -- same restart, no handoff injected -- opened at 48,744, the same band. So these numbers establish that a ~6,000-character injection does not measurably cost the opening; they do NOT establish that the handoff saves anything, because nothing separates 44,516 from 48,744. The comparison against the replaced session is confounded with a fresh session being cheap for reasons that have nothing to do with the loader -- which is the same confound that made the first run VOID. What would actually score the loader is whether the treated session REPEATS work the handoff already told it. This prediction does not measure that, and the next one should."

expect = "the next session started after a handoff shows the archive consumed, opens under 60,000 context/call, and its first ten calls cost under 1,420,000 tokens against the 142,097/call the previous session's last ten averaged -- if it opens above 60,000 because of the ~950-token injection, fall back to a pointer; if it opens above 60,000 at this injection size, the restart lever itself is wrong"

[[intervention]]
date   = "2026-08-25"
result = "FAILED, and decisively -- scored 2026-08-25, same session, n=3 short + 2 long replicates. Predicted the long agent would cost >=1.5x the three short ones. Measured 0.65x: the SPLIT arm cost 385,109 tokens over 3 agents and 12 calls, the single agent 282,568 and 217,321 over 5 calls each. Splitting the same task cost +135,164 tokens, +54%. That is under the 1.25x falsification bar in the wrong direction, so §11's lever 1 -- 'cap a dispatch at ~10 calls and split' -- is RETRACTED as a general saving. It is not VOID: the arms did equal work. Test enumeration was 17/21/19 in all three runs and defect volume 15/14/14, and the two arms agreed on the judgment call (75%) about as often as two long agents agreed with each other (82%), so the cheap arm was not the worse arm -- the disagreement is judgment irreproducibility between any two agents, not an effect of splitting, which is the control the second long replicate was run to provide. WHY it failed, measured not assumed: every agent's first call costs ~19,800 tokens before it reads anything, and the split pays that three times (+39,307, 38% of the gap against long-1); the rest is that splitting did not divide the call count -- one agent did the six files in 5 calls by batching its reads, three agents needed 12. Superlinear growth WITHIN an agent is real and visible (context grew 1.9x over a short agent's 4 calls, 3.6x over the long one's 5); it is simply too small to pay for re-entering three times. The original 2.2x was arithmetic, not a measurement: it priced 27 calls as three 9-call agents at the measured 9-call cost, assuming a split preserves the call count. It does not -- here it multiplied it by 2.4. LIMITS, and they matter before anyone generalises this: one task, six files, small units of 4-5 calls, reads that batch cleanly. Re-entry is a FIXED cost, so it amortises -- a split into genuinely long units, or one where a single agent would exhaust its context, is untested, and the 27-call dispatch that motivated lever 1 is exactly that untested regime. The claim retracted is 'splitting saves', not 'splitting never saves'."
name   = "#18 Part E: the same audit dispatched two ways -- one agent over three units against three agents over one unit each, identical per-unit briefs, identical return contract, identical output schema"
expect = "the single long agent costs at least 1.5x the sum of the three short ones. The calls^1.54 fit in working-method §11 predicts 1.9x if the long agent takes three times the calls; the one worked example on record is 2.2x. A ratio under 1.25x falsifies the fit, and §11's lever 1 -- cap a dispatch at ~10 calls and split -- must be retracted as an artefact of comparing tasks that were never the same task. The short arm runs FIRST so any prompt-cache warmth works against the hypothesis. Quality is scored too, on the same JSON schema: if the short arm returns materially fewer or worse findings the saving is fake and the result is VOID, not a pass."

[[intervention]]
date   = "2026-08-26"
name   = "#35 slice thin, batch fat: one task cut into a FIXED set of independently-testable slices, dispatched three ways -- one agent per slice, four slices per agent, and all slices to a single agent. Slice count, briefs, test commands and return contract identical across arms; only the packing varies"
expect = "cost falls as agents fall. Re-entry is fixed at ~19,800 tokens an agent (#18 Part E), so 12 slices as 12 agents pays ~238,000 of pure arrival, as 3 agents ~59,000, as 1 agent ~20,000. Prediction: the 3-agent arm beats the 12-agent arm by at least 1.25x, which is Part E's own bar applied in the direction Part E pointed rather than the one it refuted. The 1-agent arm is the real question and the reason to run this: Part E explicitly leaves long units untested, so either it beats the 3-agent arm -- and the packing rule is simply 'as few agents as possible' -- or it degrades, and WHERE it degrades is the packing number this ticket exists to find. Degradation counts only if it shows up in the per-slice test commands or in slices silently skipped, not in prose quality, because every slice carries its own check and that is the whole point of cutting on testability. If the 12-agent arm wins, re-entry does not dominate at this scale, slice-thin-batch-fat is wrong, and the 10-call cap should be un-retracted rather than quietly left retired. If all three arms land within 1.25x of each other, packing does not matter, the rule should be deleted rather than tuned, and the baton should be justified on parent growth alone"

[[intervention]]
date   = "2026-08-26"
result = "PASSED on cost, 2026-08-26, n=2 an arm, and it is the first of three predictions from per-call reasoning to get the SIGN right (\u00a711 promised 6.2x and measured 1.07x; \u00a711.1 promised 1.5x and measured 0.65x). End to end over six turns: baton 975,338 and 690,323, reader 1,368,208 and 1,476,964. Means 832,830 against 1,422,586 -- 1.71x, against a 1.25x bar. Every baton run cost less than every reader run (worst baton 975,338 < best reader 1,368,208), so the headline does not rest on averaging. THE TAIL IS THE RESULT: at the audit turn alone the arms are 1.20x apart, UNDER the bar, and in one pair the reader was ahead at t1 and behind by t2. An experiment that stopped where \u00a711.1 stopped would have reported no effect. Mechanism measured per call, not inferred: a reader tail turn costs ~127,600 tokens and a baton tail turn ~35,900, so the advantage tends to 3.55x without bound in the number of turns. The parent-stays-flat secondary HOLDS -- the baton parent runs 22,515 -> 31,767 across the whole run while the reader parent runs 22,424 -> 127,510. NEXT.md's 'wins by roughly 28x' is RETRACTED as an end-to-end number: it divided growth avoided by arrival paid, two different quantities. Direction right, magnitude overstated about eight-fold. NOT VOID -- all four runs returned all 19 modules exactly once, claim counts 121/123 against 111/100 (13.5% apart, bar was 25%), both arms fully compliant from their transcripts (baton 0 reads of src and 5 dispatches in both runs; reader 22 reads and 0 dispatches in both). Bar 4 scored rather than skipped: within-baton spread 1.41x against a 1.71x arm gap, so not noise, but thin -- and ALL of the baton spread is the parent's own call count (14 calls against 7; the r1 parent spent seven calls on a ToolSearch, a ListAgents and a slow assembly, 280,388 tokens, 41% of a run) while its agents came in 1% apart over identical 24 calls. A parent that does not read is not automatically a parent that is cheap. THE QUALIFICATION THAT MATTERS, and the bar missed it: the baton found 4 mismatches in both replicates, the reader 8 in both, and the reader's findings are close to a superset rather than a different judgment call -- two of the four the baton missed twice were verified by hand and are real defects. Per DEFECT FOUND the reader is 1.17x cheaper (177,823 against 208,208) and the headline reverses. The pre-registered volume bar was written on CLAIMS COUNTED, the denominator, when the output of the task is MISMATCHES: it would have passed a baton arm that returned zero defects with a full set of claim counts. That is the same failure as #26 and #32 one file over -- the test written to the shape of the work rather than to the point of it. So #33 answers cost and opens #47: does splitting a task across agents systematically find less? Limits: one task, one machine, 19 files that batch cleanly, five tail turns, n=2. The tail ran as one `claude -p --resume` per turn, so every turn pays a cache re-creation an uninterrupted session would not; charged to both arms in proportion to what they carry, which is the quantity under test, but it flatters both absolute numbers. Four runs cost $11.54."
name   = "#33 the end-to-end number: ONE task -- audit the module docstring of all 19 modules in src/agent_yield against their own code -- run in two arms and then continued for five IDENTICAL follow-up turns. Arm BATON: the parent may not open a single file under src/ and must dispatch agents to read; packing is the parent's call. Arm READER: the parent does the whole audit itself and may not dispatch at all. Same model, same flags, same task text, same tail; the arm paragraph is the only difference. The number scored is TOTAL tokens end to end -- every call in the parent's transcript plus every call in every agent transcript that session started -- measured by this repo's own CallRecord loader, snapshotted after every turn because subagent transcripts are volatile. Two replicates per arm, run BATON first so any prompt-cache warmth works against the hypothesis"
expect = "the baton arm costs less, end to end, by at least 1.25x. This is the comparison #18 Part E did NOT make -- Part E compared one agent against three agents, both dispatched, and nothing in it touches a parent that reads everything. The mechanism claimed in NEXT.md is an asymmetry: re-entry is paid once per agent, parent growth is paid on every parent call for the rest of the session, which is why the tail of five turns is part of the test and not decoration. BARS, all four written before either arm runs. (1) If the two arms land within 1.25x of each other, the end-to-end saving is NOT established, and NEXT.md's 'the baton still wins by roughly 28x' must be retracted as arithmetic in exactly the way §11's 6.2x and Part E's 1.5x were -- three wrong signs from per-call reasoning would make the reasoning itself the finding. (2) If BATON costs MORE than READER, the baton loses outright on this task and #34-#38 do not proceed on cost grounds. (3) VOID, not a pass, if the arms did not do equal work: both must return all 19 modules exactly once, and if either arm's total claim count is more than 25% below the other's, or the reader arm dispatches an agent, or the baton arm reads a src file itself, the run is void. (4) n=2 per arm because n=1 cannot separate an effect from noise: if the two replicates within an arm differ by more than the gap between the arms, the result is noise and is reported as noise. ALSO REPORTED, whatever the headline: the crossover turn -- the first tail turn at which cumulative baton drops below cumulative reader -- and if there is none by turn 6, the honest statement is 'not at this length', with the break-even extrapolated from the measured marginal cost of a turn in each arm rather than asserted. The parent-stays-flat prediction is scored on the same data as a secondary: the baton parent's context per call should be roughly flat across the five tail turns while the reader parent's should not"
