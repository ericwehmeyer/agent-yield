30 -- so it is the five-agent baton, not the one-agent baton, that is cheapest in tokens. Dropping 5 agents to 1 saved ~88,000 of arrival (the parent fell to a mean 186,317) and paid ~377,000 of the single agent's own GROWTH, reading module 19 while carrying modules 1-18 -- #33's reading-parent mechanism relocated into the agent rather than removed. THAT MECHANISM IS REAL AND THE COST CONCLUSION DRAWN FROM IT WAS NOT: this entry first read it as falsifying #35's premise that cost falls as agents fall, and THAT IS RETRACTED, corrected within the same session by measuring what the raw total was hiding. The single agent's growth is almost entirely CACHE READS, the cheapest token there is, so in dollars and in price-weighted tokens the one-agent arm is CHEAPER and #35's premise is SUPPORTED here, not falsified. It is contradicted only in the raw token count. See #52. AND THE UNITS DISAGREE IN SIGN, which #23 put the whole cost family in absolute tokens and so needs answering: in dollars the one-agent arm is the CHEAPEST of the three at $1.81 mean against the five-agent baton's $2.54 and the reader's $3.23, exactly reversing the token ranking, and per defect found the dollar figures are 0.402, 0.636 and 0.403 -- the one-agent baton and the reader TIE and the five-agent baton is worst, where in tokens per defect the reader wins at 177,823 against 208,208 and 232,357. MEASURED: both the token totals (this repo's CallRecord loader over explicitly named transcripts) and the dollar totals (the CLI's own total_cost_usd, which includes subagents -- the reader arms have no agents and reconcile against parent usage alone). NOW MEASURED rather than inferred, and it filed #52. Cache creation FALLS as agents fall -- 168,600 at five agents, 116,362 at one, against the reader's 213,618 -- because five agents each create their own cache where one creates once and re-reads it; read/create runs 3.9, 8.1 and 5.6. A raw token sum prices a cache read the same as an output token, and usage.p