result = "NOT RUN, AND THE PREMISE IS RETRACTED -- answered from the corpus 2026-08-26 before either arm was paid for, the way #63 was. THE 52-CALL MEDIAN THIS TICKET WAS FILED AGAINST IS ANOTHER PROJECT'S. docs/experiments/65-depth/depth.py breaks 102 subagent transcripts out by the project the session ran in -- the split \u00a711.4's own Limits section already warned about ('62 of the 84 runs come from a single project's audit fleet') and nobody had counted. model-migration-kit: n=62, median 57.5, p90 88.8, max 118, and 52 of its 62 at or over 35 calls. agent-yield: n=29, MEDIAN 5.0, p90 22, MAX 30, and ZERO at or over 35 -- the longest dispatch this repo has ever made falls short of the FLOOR of the cheaper break-even band, and the standard-schema band starts at 72. So in this repo the rule 'never split on cost' is not an untested extrapolation, it is UNTESTABLE: the depth that would test it does not occur. Where it could be wrong is the other fleet, and a depth experiment has to be run there. Depth is a property of the WORK and not of the brief -- within agent-yield `agents` reports briefed n=10 at median 4 calls against un-briefed n=17 at 5. AND THE TASK CANNOT BE SIZED UP TO MANUFACTURE THE TEST, measured rather than argued: one packed pilot (23 slices, 46 of this repo's 49 python files, results/pilot-packed-trimmed.json) issued 49 Read blocks in 15 calls -- 3.27 files per call, 2.42 tool uses per API call -- for a clean depth of ~24. Slices SHARE FILES, so cutting the same 49 files into 49 slices or 100 adds no file to open and therefore no call: the packed arm's depth scales with UNIQUE ARTIFACTS OPENED over the batch width, not with the slice count. A task that decomposes into k independent slices is exactly the task whose packed agent batches, which is the thing packing buys rather than a flaw in the task. WHAT WAS BUILT AND IS RUNNABLE: the whole harness, corpus builder with 14 seeded docstring defects each contradicted by a named constant in its own module, both arm briefs, list-dollar and packed-depth measurement, the scorer VALIDATED BEFORE ANY ARM RAN (tests/test_arms_65.py: 14/14 on an arm quoting every seed, 0 on an arm finding nothing, 0 on plausible findings that are not the seeds). THE PILOT COST $6.79 AND FOUND TWO DEFECTS THAT WOULD HAVE VOIDED EVERY RUN OF THE MATRIX: headless, every python invocation returns 'This command requires approval' -- a bare `python3 -V` does, so it is not the venv symlink -- and 16 of the packed agent's 36 calls went on it; and the packed agent DISPATCHED AN AGENT OF ITS OWN at spawnDepth 2 to run the test commands, which un-packs the packed arm. Both fixed, and the sub-dispatch detector is checked against the real violation (sub_dispatches=1, ok=False) rather than a constructed one. LIMIT ON ALL OF THIS: the reflog-style caveat applies to the corpus too -- subagent transcripts evaporate (\u00a711.2), so 102 is the survivors, and a project whose transcripts aged out is missing from the break-out entirely."
name   = "#65 the depth experiment: one agent over k slices against k agents over one slice each, on a task sized so the PACKED arm takes at least 50 calls -- the median real dispatch -- with identical per-slice briefs, test commands and return contract, n>=2 an arm, scored in LIST DOLLARS and in DEFECTS FOUND"
expect = "the packed arm costs no more than 1.25x the split arm and finds at least as many defects. THIS IS THE ONLY EXPERIMENT THAT CAN NOW MOVE §11.4. Every arm ever run -- §11.1's at 5 calls, §11.4.1's at 13.5 -- sat at a packed depth under 15, against a break-even the same section quotes at 35-196 and a median real dispatch of 52. The rule 'never split on cost' is therefore measured only at a fifth of the depth it is applied at, and both bands are extrapolations of 3-13x. If the packed arm costs MORE than 1.25x at depth 50, the rule holds below ~15 calls and nowhere else, and §11.4 must say so; if it costs less, the break-even is above 50 and the arithmetic that put it there survives its first real test. The arm must also be run at BOTH tool schemas, full and trimmed, because §11.4.1 measures the arrival price moving 2x between them and the break-even moves with it -- a single-schema result cannot tell a packing effect from a prefix effect. Bars, written before it runs: defects are scored mechanically against a ground truth named in advance, as #47 did and as #33 failed to (its bar was on claims counted, the denominator, and would have passed an arm that found nothing). VOID if the arms did not do the same work -- a slice missing or duplicated, unparseable output, or an arm that broke its own packing. Report the packed arm's actual depth: a 'depth 50' experiment whose packed agent finished in 20 calls has not been run."
