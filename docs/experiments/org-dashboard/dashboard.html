<div class="wrap">
  <div class="masthead">
    <h1>Agent Yield Drilldown</h1>
    <span class="metric-name">list-price dollars per 1,000 inserted lines, over time, down the org</span>
  </div>
  <div class="synth-banner">
    <strong>SYNTHETIC SCAFFOLD.</strong> This corpus has one user and two machines. Every
    team except <b>Agent Yield</b> is generated, and every generated number is chipped
    <span class="chip chip-synth">SYNTHETIC</span> where it appears. The one real team is chipped
    <span class="chip chip-real">REAL</span>.
  </div>
  <div id="app"></div>
</div>
<div id="tip" role="status"></div>

<script>
"use strict";

/* =====================================================================
   Data. THRESHOLDS is the one block a rebuild regenerates: its values are
   read from src/agent_yield/thresholds.py at build time (2026-08-26), and
   every label that mentions a band is rendered from this object at runtime,
   never typed into markup.
   ===================================================================== */
const THRESHOLDS = {
  ladder: ["dispatch", "restart", "stop"],
  dispatch: 300000,
  restart: 500000,
  stop: 700000,
  source: "src/agent_yield/thresholds.py, read 2026-08-26",
};

/* The numerator's unit. LIST-PRICE EQUIVALENTS, not a bill: `pricing.py` says
   plainly that on a subscription the ranking of two ways of working survives
   and the absolute figure does not. Raw `usage.total` is not scoreable --
   `thresholds.py` L76 calls it crude in the same file this page was told to
   read, because ~97% of that sum is cache reads at 0.10x a base input token,
   so two teams with the same tok/ins can differ by a factor in dollars.
   Constants below are pricing.py's, copied, and the model is its formula:
     cost = base(model) x (input + 0.10*cache_read + 1.25*cw_5m
                           + 2.00*cw_1h + 5.00*output) */
const PRICING = {
  baseRatePerMTok: { "claude-opus-5": 5.00, "claude-fable-5": 10.00,
                     "claude-sonnet-5": 2.00, "claude-haiku-4-5": 1.00 },
  cacheRead: 0.10, cacheWrite5m: 1.25, cacheWrite1h: 2.00, output: 5.00,
  source: "src/agent_yield/pricing.py, re-read 2026-08-26 after #81",
  basis: "list",
};

/* The real leaf. BOTH BLOCKS BELOW ARE GENERATED -- do not hand-edit them.
   `docs/experiments/org-dashboard/dashboard-data.py` writes them from the
   corpus and this clone's reflog in ONE invocation, stamps that one instant
   on `REAL_SCOPE.captured`, and re-reads them with `--check`. They are JSON
   rather than the hand-authored JS the rest of this file uses precisely so
   that they can be read back.

   #73 is why. The page used to hold a numerator from one run of `report` and
   a denominator from a later run of `outcomes`, printed neither capture time,
   and disagreed with the CLI three ways on its second day. 0.3%, no
   conclusion changed -- and no reader had anything with which to notice.

   Numerator: calls whose recorded cwd is this repo. Denominator: commits and
   insertions this clone's reflog wrote. Same work on both sides, and now the
   same instant. A day that had not ended when the capture ran carries
   `partial: true` and is chipped PARTIAL wherever its row appears. */
const REAL_SCOPE = {
  "calls": "1,365 of 4,419 calls this machine made 2026-08-25..2026-08-26 -- those whose recorded cwd is C:\\Users\\ewehm\\repos\\agent-yield (21,614 calls in the corpus overall)",
  "outcomes": "commits and insertions from this clone's reflog (--machine); unattributable: 0 across the window",
  "captured": "captured 2026-08-26 22:53 UTC -- numerator and denominator from one invocation of dashboard-data.py, at that one instant; 2026-08-26 had not ended and is marked PARTIAL",
  "numerator": "list-price equivalents from pricing.py over those same 1,365 calls, priced per model"
};
const REAL_DAYS = [
  {"day": "2026-08-25", "partial": false, "tokens": 17787031, "calls": 146, "commits": 10, "merges": 0, "code": 1127, "docs": 3025, "other": 51, "mainCtx": 178226, "subCtx": 42095, "bands": [20, 0, 0], "dollars": 15.1814, "crUsd": 7.604, "crTok": 16900225, "unpricedTok": 0, "unpricedModels": []},
  {"day": "2026-08-26", "partial": true, "tokens": 180503595, "calls": 1219, "commits": 56, "merges": 0, "code": 3911, "docs": 4723, "other": 2181, "mainCtx": 156900, "subCtx": 70918, "bands": [3, 0, 0], "dollars": 147.8334, "crUsd": 89.763, "crTok": 176300681, "unpricedTok": 0, "unpricedModels": []}
];
const REAL_MACHINES = [
  { name: "windows (this clone)", real: true },
  { name: "macOS clone", real: false,
    unscorable: "this machine's corpus holds no macOS calls; its ledger lives on that machine (#66 asks for it)" },
];

/* ---------------------------------------------------------------- synthetic
   Deterministic (seeded), regenerated identically on every load. 56 days
   ending 2026-08-26; the rollup compares the last 28 against the prior 28. */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const N_DAYS = 56;
const DAY_MS = 86400000;
const END_DAY = Date.UTC(2026, 7, 26);
function dayISO(i) { return new Date(END_DAY - (N_DAYS - 1 - i) * DAY_MS).toISOString().slice(0, 10); }

/* `cr`/`cw`/`out` are shares of the day's raw tokens and `opus` is the share
   of the spend on the dear model. They are what makes dollars something other
   than a rescaled token count: Payments and Trading Tools sit 6% apart on
   tok/ins and 2.6x apart in dollars, which is the whole reason the headline
   changed unit. Chosen, like every other synthetic shape here, and held still
   across the window so a team's period-over-period delta stays a fact about
   its work rather than about a profile that was made to drift. */
const SYNTH_PARAMS = [
  { id: "payments",   name: "Payments",       seed: 11, tok: 60e6, ins: 5200, tokTrend: 1.00, mixA: [0.55, 0.35, 0.10], mixB: [0.55, 0.35, 0.10], noise: 0.10, cr: 0.985, cw: 0.010, out: 0.003, opus: 0.55 },
  { id: "risk",       name: "Risk Analytics", seed: 23, tok: 55e6, ins: 4800, tokTrend: 1.90, mixA: [0.52, 0.38, 0.10], mixB: [0.52, 0.38, 0.10], noise: 0.10, cr: 0.970, cw: 0.018, out: 0.006, opus: 0.95 },
  { id: "platform",   name: "Platform",       seed: 37, tok: 75e6, ins: 6100, tokTrend: 1.05, mixA: [0.60, 0.30, 0.10], mixB: [0.60, 0.30, 0.10], noise: 0.09, cr: 0.975, cw: 0.015, out: 0.005, opus: 0.80 },
  { id: "portal",     name: "Client Portal",  seed: 41, tok: 48e6, ins: 4000, tokTrend: 1.00, insTrend: 1.55, mixA: [0.52, 0.38, 0.10], mixB: [0.27, 0.63, 0.10], noise: 0.09, cr: 0.960, cw: 0.024, out: 0.008, opus: 0.85 },
  { id: "marketdata", name: "Market Data",    seed: 53, tok: 40e6, ins: 3600, tokTrend: 0.85, mixA: [0.58, 0.32, 0.10], mixB: [0.58, 0.32, 0.10], noise: 0.10, cr: 0.980, cw: 0.012, out: 0.004, opus: 0.70 },
  { id: "trading",    name: "Trading Tools",  seed: 67, tok: 66e6, ins: 5400, tokTrend: 1.00, mixA: [0.56, 0.34, 0.10], mixB: [0.56, 0.34, 0.10], noise: 0.20, cr: 0.945, cw: 0.033, out: 0.010, opus: 1.00 },
];

/* pricing.py's formula, over a token split. List-price equivalents. */
function priceSplit(inp, cr, cw, out, opusShare) {
  const weighted = inp + PRICING.cacheRead * cr + PRICING.cacheWrite5m * cw + PRICING.output * out;
  const rate = opusShare * PRICING.baseRatePerMTok["claude-opus-5"] +
    (1 - opusShare) * PRICING.baseRatePerMTok["claude-haiku-4-5"];
  return { dollars: rate * weighted / 1e6, crUsd: rate * PRICING.cacheRead * cr / 1e6 };
}

function genTeamDays(p) {
  const rnd = mulberry32(p.seed);
  const days = [];
  for (let i = 0; i < N_DAYS; i++) {
    const t = i / (N_DAYS - 1);
    const wk = 1 - 0.55 * (new Date(END_DAY - (N_DAYS - 1 - i) * DAY_MS).getUTCDay() % 6 === 0 ? 1 : 0);
    const jitter = () => 1 + p.noise * (rnd() * 2 - 1);
    const tokens = Math.round(p.tok * (1 + (p.tokTrend - 1) * t) * wk * jitter());
    const ins = Math.round(p.ins * (1 + ((p.insTrend || 1) - 1) * t) * wk * jitter());
    const mix = p.mixA.map((a, k) => a + (p.mixB[k] - a) * t);
    const code = Math.round(ins * mix[0]);
    const docs = Math.round(ins * mix[1]);
    const other = Math.max(0, ins - code - docs);
    const calls = Math.max(1, Math.round(tokens / 145000 * jitter()));
    const commits = Math.max(1, Math.round(ins / 110 * jitter()));
    const bands = [
      Math.max(0, Math.round(16 * jitter())),
      Math.max(0, Math.round(3 * jitter())),
      Math.max(0, Math.round(1 * jitter())),
    ];
    const crTok = Math.round(tokens * p.cr);
    const cwTok = Math.round(tokens * p.cw);
    const outTok = Math.round(tokens * p.out);
    const inpTok = Math.max(0, tokens - crTok - cwTok - outTok);
    const priced = priceSplit(inpTok, crTok, cwTok, outTok, p.opus);
    days.push({ day: dayISO(i), tokens, calls, commits, merges: 0, code, docs, other,
      mainCtx: Math.round(150000 * jitter()), subCtx: Math.round(50000 * jitter()), bands,
      dollars: priced.dollars, crUsd: priced.crUsd, crTok,
      unpricedTok: 0, unpricedModels: [] });
  }
  return days;
}

/* ---------------------------------------------------------------- the tree
   One recursive shape. A node with children renders the rollup view; a node
   without renders the team ledger. A deeper org is more internal nodes with
   the same two renderers, not another screen. */
const TREE = {
  id: "org", name: "All teams", synthetic: true,
  scope: [
    "<b>window:</b> 2026-07-02 \u2192 2026-08-26, compared as last 28 days against the prior 28",
    "<b>numerator:</b> each team's own recorded calls \u00b7 <b>denominator:</b> the same team's commits and inserted lines \u2014 per team, same work on both sides",
    "<b>aggregate:</b> synthetic teams only; the one real team is never blended into an invented total",
  ],
  children: SYNTH_PARAMS.map((p) => ({
    id: p.id, name: p.name, synthetic: true, days: genTeamDays(p),
    scope: [
      "<b>SYNTHETIC:</b> every number on this view is generated (seed " + p.seed + "), shaped like the real ledger below it",
      "<b>numerator:</b> generated calls for " + p.name + " \u00b7 <b>denominator:</b> generated commits and insertions for " + p.name,
    ],
  })).concat([{
    id: "agent-yield", name: "Agent Yield", synthetic: false, days: REAL_DAYS,
    scope: [
      "<b>REAL:</b> " + REAL_SCOPE.calls,
      "<b>denominator:</b> " + REAL_SCOPE.outcomes,
      REAL_SCOPE.captured,
    ],
  }]),
};

/* =====================================================================
   Metrics. tokens_per_insertion (ANY inserted line) is the headline: the
   least gameable denominator on record. The code and docs halves exist only
   inside the rendered triple any/code/docs, mirroring PerInsertion.render;
   there is no attribute, column, or series a reader can select for a half.
   ===================================================================== */
function sumDays(days) {
  const s = { tokens: 0, calls: 0, commits: 0, code: 0, docs: 0, other: 0,
    crTok: 0, unpricedTok: 0, n: days.length };
  let usdTotal = null, crUsdTotal = null;
  const unpriced = new Set();
  for (const d of days) {
    s.tokens += d.tokens; s.calls += d.calls; s.commits += d.commits;
    s.code += d.code; s.docs += d.docs; s.other += d.other;
    s.crTok += d.crTok || 0; s.unpricedTok += d.unpricedTok || 0;
    for (const m of d.unpricedModels || []) unpriced.add(m);
    // null, never 0: a window in which nothing could be priced has no dollar
    // figure at all, and 0 would read as "it was free".
    if (d.dollars != null) {
      usdTotal = (usdTotal || 0) + d.dollars;
      crUsdTotal = (crUsdTotal || 0) + (d.crUsd || 0);
    }
  }
  s.dollars = usdTotal; s.crUsd = crUsdTotal;
  s.unpricedModels = Array.from(unpriced).sort();
  s.ins = s.code + s.docs + s.other;
  return s;
}

/* HEADLINE: list-price dollars per 1,000 inserted lines, any kind. The
   denominator is unchanged and still the least gameable one on record; the
   numerator is no longer raw `usage.total`, which is ~97% cache reads at 0.10x
   and so ranks teams by cache-hit rate rather than by work. */
function usdPerKIns(s) { return (s.ins && s.dollars != null) ? 1000 * s.dollars / s.ins : null; }
function usdPerCommit(s) { return (s.commits && s.dollars != null) ? s.dollars / s.commits : null; }
function tripleParts(s) { // PerInsertion.render: all three or none, halves unnamed
  const r = (den) => (den ? 1000 * s.dollars / den : null);
  return [r(s.ins), r(s.code), r(s.docs)];
}
function tripleUSD(s) { return s.dollars == null ? UNSC : tripleParts(s).map(usd).join("/"); }
function tripleUSDText(s) { return s.dollars == null ? "UNSCORABLE" : tripleParts(s).map(usdText).join("/"); }

/* SECONDARY, and rendered only beneath a heading that says so. */
function tokPerIns(s) { return s.ins ? s.tokens / s.ins : null; }
function tokPerCommit(s) { return s.commits ? s.tokens / s.commits : null; }
function triple(s) {
  const r = (den) => (den ? s.tokens / den : null);
  return [r(s.ins), r(s.code), r(s.docs)].map(fmt0).join("/");
}

/* Two cache-read shares, and the gap between them is the point: cache reads
   are nearly all of the tokens and about half to two thirds of the money.
   Every scope strip prints both, so a reader can see which unit is in play. */
function crShareTok(s) { return s.tokens ? s.crTok / s.tokens : null; }
function crShareUsd(s) { return s.dollars ? s.crUsd / s.dollars : null; }
/* The lower-bound clause, and it asks PRICING rather than asserting -- #74's
   lesson, that a figure stated as a string literal goes on claiming something
   its own data stopped supporting. `unpricedModels` records what was unpriced
   WHEN THIS LEAF WAS CAPTURED, which is a fact about the capture and does not
   change. Whether a rate exists NOW is a different fact, read off the table, so
   #81 landing two rates flips the second half of this sentence with no edit
   here. The figure stays a lower bound either way: repricing needs the
   per-model component split, and this capture carries only raw token totals. */
function unpricedNote(s) {
  if (!s.unpricedModels.length) return "";
  const since = s.unpricedModels.filter((m) => PRICING.baseRatePerMTok[m] !== undefined);
  const still = s.unpricedModels.filter((m) => PRICING.baseRatePerMTok[m] === undefined);
  let note = " \u2014 " + fmt0(s.unpricedTok) + " tokens on " + s.unpricedModels.length +
    " model" + (s.unpricedModels.length > 1 ? "s" : "") +
    " (" + esc(s.unpricedModels.join(", ")) + ") were unpriced when this leaf was" +
    " captured, so the figure is a lower bound";
  if (still.length) {
    note += "; pricing.py still has no reconciled rate for " + esc(still.join(", "));
  }
  if (since.length) {
    note += "; pricing.py has since reconciled " + esc(since.join(", ")) +
      " (#81), but repricing needs the per-model component split this capture" +
      " does not carry \u2014 raw token totals cannot be priced";
  }
  return note;
}
function inWindow(days, fromIdx) {
  const lo = dayISO(fromIdx[0]), hi = dayISO(fromIdx[1]);
  return days.filter((d) => d.day >= lo && d.day <= hi);
}
const CUR = [28, 55], PRIOR = [0, 27];
const CUR_LABEL = dayISO(28) + " \u2192 " + dayISO(55);
const PRIOR_LABEL = dayISO(0) + " \u2192 " + dayISO(27);

/* ---------------------------------------------------------------- format */
function fmt0(v) { return v == null ? "-" : Math.round(v).toLocaleString("en-US"); }
function pct(v) { return v == null ? "-" : (v >= 0 ? "+" : "") + (v * 100).toFixed(0) + "%"; }
function pct1(v) { return v == null ? "-" : (v * 100).toFixed(1) + "%"; }
const UNSC = '<span class="chip chip-unsc">UNSCORABLE</span>';
const PART = '<span class="chip chip-part" title="this day had not ended when the leaf was captured; its figures are a floor and will have moved since">PARTIAL</span>';
/* A day's chip, or nothing. Generated days carry `partial`; the synthetic
   generator does not set it, and an absent flag means the day was closed. */
function dayChip(d) { return d.partial ? " " + PART : ""; }
/* Returns HTML, and UNSCORABLE -- never a dash, never a token figure -- when
   the unit cannot be produced. Its output is digits, so it needs no escaping. */
function usdText(v) {
  return v == null ? "UNSCORABLE" : "$" + v.toLocaleString("en-US",
    { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function usd(v) { return v == null ? UNSC : usdText(v); }
function usdAxis(v) { return "$" + (v === 0 ? "0" : v.toFixed(v < 10 ? 1 : 0)); }
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }

/* =====================================================================
   Chart primitives: hand-written SVG, hairline solid grid, thin marks,
   4px rounded data ends square at the baseline, 2px surface gaps.
   ===================================================================== */
const tipEl = () => document.getElementById("tip");
function showTip(evt, rowsHTML, title) {
  const t = tipEl();
  t.innerHTML = (title ? '<div class="t-title">' + esc(title) + "</div>" : "") + rowsHTML;
  t.style.display = "block";
  const pad = 14, w = t.offsetWidth, h = t.offsetHeight;
  let x = evt.clientX + pad, y = evt.clientY + pad;
  if (x + w > window.innerWidth - 8) x = evt.clientX - w - pad;
  if (y + h > window.innerHeight - 8) y = evt.clientY - h - pad;
  t.style.left = x + "px"; t.style.top = y + "px";
}
function hideTip() { tipEl().style.display = "none"; }
function tipRow(color, value, label) {
  return '<div class="t-row">' +
    (color ? '<span class="t-key" style="background:' + color + '"></span>' : "") +
    '<span class="val">' + esc(value) + '</span><span class="lbl">' + esc(label) + "</span></div>";
}

function niceMax(v) {
  if (v <= 0) return 1;
  const mag = Math.pow(10, Math.floor(Math.log10(v)));
  for (const m of [1, 2, 2.5, 5, 10]) if (v <= m * mag) return m * mag;
  return 10 * mag;
}
function roundRight(x, y, w, h, r) { // horizontal bar: square left (baseline), rounded right (data end)
  r = Math.min(r, w / 2, h / 2);
  return "M" + x + " " + y + " h" + (w - r) + " a" + r + " " + r + " 0 0 1 " + r + " " + r +
    " v" + (h - 2 * r) + " a" + r + " " + r + " 0 0 1 " + (-r) + " " + r + " h" + (-(w - r)) + " Z";
}
function roundTop(x, y, w, h, r) { // column: square bottom (baseline), rounded top (data end)
  r = Math.min(r, w / 2, h / 2);
  return "M" + x + " " + (y + h) + " v" + (-(h - r)) + " a" + r + " " + r + " 0 0 1 " + r + " " + (-r) +
    " h" + (w - 2 * r) + " a" + r + " " + r + " 0 0 1 " + r + " " + r + " v" + (h - r) + " Z";
}

/* =====================================================================
   Navigation: a path of ids into TREE. In-page only.
   ===================================================================== */
let PATH = ["org"];
function nodeAt(path) {
  let node = TREE;
  for (const id of path.slice(1)) node = node.children.find((c) => c.id === id);
  return node;
}
function go(path) { PATH = path; render(); window.scrollTo({ top: 0 }); }

function crumbsHTML() {
  const parts = [];
  for (let i = 0; i < PATH.length; i++) {
    const node = nodeAt(PATH.slice(0, i + 1));
    if (i === PATH.length - 1) parts.push('<span class="here">' + esc(node.name) + "</span>");
    else parts.push('<button data-crumb="' + i + '">' + esc(node.name) + "</button>");
  }
  return '<nav class="crumbs" aria-label="org path">' + parts.join('<span aria-hidden="true">/</span>') + "</nav>";
}
/* The scope strip carries the UNIT as well as the window. B1 was a correct
   ratio whose numerator nobody had stated, so both cache-read shares print
   here: nearly all of the tokens, well under all of the money. */
function unitLine(label, s) {
  return "<b>numerator:</b> list-price equivalents from pricing.py (costBasis " +
    esc(PRICING.basis) + ")" + (label ? " \u00b7 <b>" + esc(label) + ":</b> " : " \u00b7 ") +
    usd(s.dollars) + ", of which cache reads are <b>" + pct1(crShareUsd(s)) +
    " of the dollars</b> against " + pct1(crShareTok(s)) + " of the raw tokens" + unpricedNote(s);
}
function unitLines(node) {
  if (node.children) {
    return [unitLine("", sumDays(node.children.filter((c) => c.synthetic)
      .flatMap((c) => inWindow(c.days, CUR))))];
  }
  // A real leaf prints every day it has: #72's acceptance, and the two days
  // here disagree by 15 points on the dollar share while agreeing to within 3
  // on the token share -- which is the finding, on the page, in one strip.
  if (!node.synthetic) return node.days.map((d) => unitLine(d.day, sumDays([d])));
  return [unitLine("", sumDays(node.days.slice(-28)))];
}
function scopeHTML(node) {
  const lines = node.scope.concat(unitLines(node));
  return '<div class="scope">' + lines.map((line) => "<div>" + line + "</div>").join("") + "</div>";
}
function chip(node) {
  return node.synthetic ? '<span class="chip chip-synth">SYNTHETIC</span>'
    : '<span class="chip chip-real">REAL</span>';
}
function bandLegend() {
  return '<p class="bandnote">cost bands: share of the day\u2019s main-thread calls at or above ' +
    THRESHOLDS.ladder.map((b) => fmt0(THRESHOLDS[b])).join(" / ") +
    " context tokens (" + esc(THRESHOLDS.ladder.join("/")) + "); thresholds read from " +
    esc(THRESHOLDS.source) + "</p>";
}

/* =====================================================================
   Rollup view: an internal node over its children.
   ===================================================================== */
function teamStats(team) {
  const cur = sumDays(inWindow(team.days, CUR));
  const prior = sumDays(inWindow(team.days, PRIOR));
  const yCur = usdPerKIns(cur), yPrior = usdPerKIns(prior);
  return {
    team, cur, prior, yCur, yPrior,
    delta: (yCur != null && yPrior != null && yPrior !== 0) ? (yCur - yPrior) / yPrior : null,
  };
}

function renderRollup(node) {
  const stats = node.children.map(teamStats);
  const synth = stats.filter((s) => s.team.synthetic);
  const aggCur = sumDays(synth.flatMap((s) => inWindow(s.team.days, CUR)));
  const aggPrior = sumDays(synth.flatMap((s) => inWindow(s.team.days, PRIOR)));
  const aggY = usdPerKIns(aggCur), aggYP = usdPerKIns(aggPrior);
  const aggDelta = aggYP ? (aggY - aggYP) / aggYP : null;

  // outlier: largest |delta| among synthetic teams
  const outlier = synth.slice().sort((a, b) => Math.abs(b.delta) - Math.abs(a.delta))[0];
  const mixShifted = synth.slice().sort((a, b) => {
    const shift = (s) => Math.abs(s.cur.docs / s.cur.ins - s.prior.docs / s.prior.ins);
    return shift(b) - shift(a);
  })[0];

  const deltaHTML = (d, label) => {
    if (d == null) return '<span class="chip chip-unsc" title="no data in the prior window">UNSCORABLE</span>';
    const cls = d > 0 ? "worse" : "better";
    return '<span class="' + cls + '">' + pct(d) + "</span> " + esc(label);
  };

  let html = crumbsHTML() + scopeHTML(node);

  // KPI row: the aggregate is synthetic-only and says so.
  html += '<div class="tiles">' +
    tile("$ per 1,000 inserted lines, last 28 days " + '<span class="chip chip-synth">SYNTHETIC AGGREGATE</span>',
      usd(aggY), true, deltaHTML(aggDelta, "vs prior 28 days"), true) +
    tile("list-price equivalent, last 28 days " + '<span class="chip chip-synth">SYNTHETIC AGGREGATE</span>',
      usd(aggCur.dollars), false,
      esc(fmt0(aggCur.calls)) + " calls \u00b7 " + esc(fmt0(aggCur.tokens)) + " raw tokens", true) +
    tile("inserted lines, last 28 days " + '<span class="chip chip-synth">SYNTHETIC AGGREGATE</span>', fmt0(aggCur.ins), false,
      esc(fmt0(aggCur.commits)) + " commits") +
    tile("teams", String(node.children.length), false,
      esc(String(synth.length)) + " synthetic \u00b7 1 real") +
    "</div>";

  html += '<div class="figure-grid">';
  html += figRankedBars(stats, outlier);
  html += figWeeklyTrend(stats, outlier);
  html += figMixShift(stats, mixShifted);
  html += "</div>";

  // team table
  html += '<div class="section-h">Every team, both windows</div>' +
    '<p class="section-sub">$/1k ins is the whole ratio; any/code/docs is its one decomposition, ' +
    "rendered together or not at all. Click a row to drill in.</p>";
  html += '<div class="tblwrap"><table><thead><tr>' +
    "<th>team</th><th>data</th><th>$ (28d)</th><th>commits</th><th>inserted lines</th>" +
    "<th>$/1k ins</th><th>any/code/docs</th><th>vs prior 28d</th>" +
    "</tr></thead><tbody>";
  for (const s of stats) {
    const d = s.delta;
    const deltaCell = d == null
      ? '<span class="chip chip-unsc" title="no corpus in the prior window">UNSCORABLE</span>'
      : '<span class="' + (d > 0 ? "worse" : "better") + '">' + pct(d) + "</span>";
    const note = s.team.synthetic ? "" :
      " <span style='color:var(--muted)'>(" + s.cur.n + " days of corpus)</span>";
    html += '<tr class="row-link" tabindex="0" role="link" data-team="' + esc(s.team.id) + '">' +
      "<td>" + esc(s.team.name) + note + "</td>" +
      "<td>" + chip(s.team) + "</td>" +
      "<td>" + usd(s.cur.dollars) + "</td>" +
      "<td>" + fmt0(s.cur.commits) + "</td>" +
      "<td>" + fmt0(s.cur.ins) + "</td>" +
      "<td><b>" + usd(s.yCur) + "</b></td>" +
      "<td>" + tripleUSD(s.cur) + "</td>" +
      "<td>" + deltaCell + "</td></tr>";
  }
  html += "</tbody></table></div>";
  html += '<p class="bandnote">$ per 1,000 inserted lines: the list-price equivalent of a team\u2019s recorded calls, ' +
    "over the inserted lines that team\u2019s own commits shipped, same window. Lower is better. UNSCORABLE means the window " +
    "has no corpus, or that nothing in it could be priced \u2014 not that nothing happened. On a subscription the RANKING of two " +
    "ways of working survives and the absolute figure does not; " + esc(PRICING.source) + ".</p>";
  html += secondaryTokens(stats.map((s) => [s.team.name, s.cur]));
  return html;
}

/* SECONDARY. Raw `usage.total` ratios live here and nowhere else on this page:
   no tile, no axis, no headline, no ranked bar. They are kept because a reader
   who wants to watch the two units disagree needs both of them -- and put
   under a heading that says which one is not scoreable. */
function secondaryTokens(rows) {
  let h = '<div class="section-h">Secondary: the same ratios in raw tokens</div>' +
    '<p class="section-sub">Not the headline, and not rankable. <b>Roughly 97% of a raw token total is cache reads, ' +
    "at 0.10x a base input token</b>, so tok/ins ranks cache-hit rate about as much as it ranks work \u2014 which is " +
    "why it sits in this table and not on a tile. thresholds.py L76 says the same thing in the source the page reads.</p>";
  h += '<div class="tblwrap"><table><thead><tr><th>unit</th><th>raw tokens</th><th>tok/ins</th>' +
    "<th>any/code/docs</th><th>cache reads, share of tokens</th></tr></thead><tbody>";
  for (const row of rows) {
    const s = row[1];
    h += "<tr><td>" + esc(row[0]) + "</td><td>" + fmt0(s.tokens) + "</td><td>" + fmt0(tokPerIns(s)) +
      "</td><td>" + triple(s) + "</td><td>" + pct1(crShareTok(s)) + "</td></tr>";
  }
  return h + "</tbody></table></div>";
}

function tile(k, v, hero, d, raw) {
  // `raw` is for values that are already HTML -- usd() returns an UNSCORABLE
  // chip, and escaping it would print the markup.
  return '<div class="tile"><div class="k">' + k + '</div><div class="v' + (hero ? " hero" : "") + '">' +
    (raw ? v : esc(v)) + '</div><div class="d">' + (d || "") + "</div></div>";
}

/* Figure: ranked bars, one hue (the metric across teams), delta labels. */
function figRankedBars(stats, outlier) {
  const rows = stats.slice().sort((a, b) => (b.yCur ?? -1) - (a.yCur ?? -1));
  const W = 640, labelW = 120, valW = 150, barH = 20, gap = 14, top = 6;
  const H = top + rows.length * (barH + gap);
  const maxV = niceMax(Math.max(...rows.map((r) => r.yCur || 0)));
  const plotW = W - labelW - valW;
  let marks = "";
  rows.forEach((r, i) => {
    const y = top + i * (barH + gap);
    const w = Math.max(2, (r.yCur || 0) / maxV * plotW);
    const isOut = r === outlier;
    const deltaTxt = r.delta == null ? "UNSCORABLE" : pct(r.delta) + " vs prior";
    const deltaFill = r.delta == null ? "var(--unsc-ink)" : (r.delta > 0 ? "var(--bad)" : "var(--good)");
    marks += '<g class="bar-link" tabindex="0" role="link" data-team="' + esc(r.team.id) + '" ' +
      'data-tip="' + esc(r.team.name + "\u2007" + usdText(r.yCur) + " per 1,000 inserted lines \u00b7 any/code/docs " + tripleUSDText(r.cur) +
        (r.team.synthetic ? " \u00b7 SYNTHETIC" : " \u00b7 REAL, " + r.cur.n + " days")) + '">' +
      '<rect x="0" y="' + (y - 4) + '" width="' + W + '" height="' + (barH + 8) + '" fill="transparent"></rect>' +
      '<text x="' + (labelW - 8) + '" y="' + (y + barH / 2 + 4) + '" text-anchor="end" ' +
        'font-size="12" fill="var(--ink)" font-weight="' + (isOut ? 600 : 400) + '">' + esc(r.team.name) + "</text>" +
      '<path d="' + roundRight(labelW, y, w, barH, 4) + '" fill="var(--accent)"' + (r.team.synthetic ? ' opacity="0.55"' : "") + "></path>" +
      '<text x="' + (labelW + w + 7) + '" y="' + (y + barH / 2 + 4) + '" font-size="12" ' +
        'fill="var(--ink)" font-weight="600">' + esc(usdText(r.yCur)) + "</text>" +
      '<text x="' + (W - 2) + '" y="' + (y + barH / 2 + 4) + '" text-anchor="end" font-size="10.5" ' +
        'font-family="IBM Plex Mono, monospace" fill="' + deltaFill + '">' + esc(deltaTxt) + "</text></g>";
  });
  const outLabel = outlier.team.name + " is " + (outlier.yCur / medianOf(stats.filter((s) => s !== outlier).map((s) => s.yCur))).toFixed(1) +
    "x the median of its siblings and " + pct(outlier.delta) + " on itself";
  return '<div class="figure"><h2>' + esc(outlier.team.name) + " is the outlier</h2>" +
    '<p class="note"><b>' + esc(outLabel) + ".</b> Bars are the last 28 days; solid is the real team, translucent is synthetic. Click a bar to drill in.</p>" +
    '<svg viewBox="0 0 ' + W + " " + H + '" aria-label="list-price dollars per 1,000 inserted lines by team">' + marks + "</svg>" +
    '<p class="foot">Agent Yield\u2019s bar covers its 2 days of corpus \u2014 the only real data in this window \u2014 and its delta is UNSCORABLE because the prior window holds no corpus at all.</p></div>';
}
function medianOf(vals) {
  const v = vals.filter((x) => x != null).sort((a, b) => a - b);
  return v.length ? (v.length % 2 ? v[(v.length - 1) / 2] : (v[v.length / 2 - 1] + v[v.length / 2]) / 2) : null;
}

/* Figure: weekly trend, emphasis form (outlier in the accent, rest gray). */
function figWeeklyTrend(stats, outlier) {
  const weeks = [];
  for (let w = 0; w < 8; w++) weeks.push([w * 7, w * 7 + 6]);
  const series = stats.filter((s) => s.team.synthetic).map((s) => ({
    team: s.team,
    pts: weeks.map(([a, b]) => usdPerKIns(sumDays(inWindow(s.team.days, [a, b])))),
  }));
  const W = 640, H = 240, padL = 58, padR = 118, padT = 12, padB = 26;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const maxV = niceMax(Math.max(...series.flatMap((s) => s.pts.filter((p) => p != null))));
  const x = (i) => padL + i / 7 * plotW;
  const y = (v) => padT + (1 - v / maxV) * plotH;
  let grid = "";
  for (let g = 0; g <= 4; g++) {
    const v = maxV * g / 4, yy = y(v);
    grid += '<line x1="' + padL + '" y1="' + yy + '" x2="' + (W - padR) + '" y2="' + yy + '" stroke="var(--grid)" stroke-width="1"></line>' +
      '<text x="' + (padL - 8) + '" y="' + (yy + 4) + '" text-anchor="end" font-size="10.5" font-family="IBM Plex Mono, monospace" fill="var(--muted)">' + usdAxis(v) + "</text>";
  }
  let ticks = "";
  weeks.forEach(([a], i) => {
    ticks += '<text x="' + x(i) + '" y="' + (H - 8) + '" text-anchor="middle" font-size="10" font-family="IBM Plex Mono, monospace" fill="var(--muted)">' + dayISO(a).slice(5) + "</text>";
  });
  let lines = "";
  const drawSeries = (s, color, width, label) => {
    const d = s.pts.map((p, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(p).toFixed(1)).join(" ");
    let out = '<path d="' + d + '" fill="none" stroke="' + color + '" stroke-width="' + width + '" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 4"></path>';
    const last = s.pts[s.pts.length - 1];
    out += '<circle cx="' + x(7) + '" cy="' + y(last) + '" r="4" fill="' + color + '" stroke="var(--surface)" stroke-width="2"></circle>';
    if (label) out += '<text x="' + (x(7) + 9) + '" y="' + (y(last) + 4) + '" font-size="11.5" fill="var(--ink)" font-weight="600">' + esc(label) + "</text>";
    return out;
  };
  for (const s of series) if (s.team !== outlier.team) lines += drawSeries(s, "var(--context-line)", 2, "");
  const outS = series.find((s) => s.team === outlier.team);
  lines += drawSeries(outS, "var(--accent)", 2.5, outlier.team.name);
  // crosshair layer
  const hover = '<rect id="trendHover" x="' + padL + '" y="' + padT + '" width="' + plotW + '" height="' + plotH + '" fill="transparent"></rect>' +
    '<line id="trendX" x1="0" y1="' + padT + '" x2="0" y2="' + (padT + plotH) + '" stroke="var(--baseline)" stroke-width="1" style="display:none"></line>';
  const ratio = (outS.pts[7] / outS.pts[0]).toFixed(1);
  window.__trend = { series, weeks, x, padL, plotW, outlierTeam: outlier.team };
  return '<div class="figure"><h2>The divergence is eight weeks old, not a blip</h2>' +
    '<p class="note"><b>' + esc(outlier.team.name) + " ends the window at " + ratio + "x its own starting ratio; its five siblings hold flat.</b> Weekly $ per 1,000 inserted lines; dashes mark every series here as synthetic.</p>" +
    '<svg id="trendSvg" viewBox="0 0 ' + W + " " + H + '" aria-label="weekly list-price dollars per 1,000 inserted lines per team">' + grid + ticks + lines + hover + "</svg>" +
    '<div class="legend">' +
      '<span class="key"><span class="linekey" style="background:var(--accent)"></span>' + esc(outlier.team.name) + " (synthetic)</span>" +
      '<span class="key"><span class="linekey" style="background:var(--context-line)"></span>5 siblings (synthetic)</span>' +
    "</div>" +
    '<p class="foot">Agent Yield (REAL) is not plotted: 2 days of corpus is not a week, and stretching it to one would put a cross-scope point on a same-scope chart. Its ledger is one click down.</p></div>';
}

/* Figure: mix, the guard against a mix artefact read as efficiency. */
function figMixShift(stats, mixShifted) {
  const rows = stats.filter((s) => s.team.synthetic);
  const W = 640, labelW = 130, pctW = 46, barH = 13, pairGap = 3, rowGap = 15, top = 4;
  const H = top + rows.length * (2 * barH + pairGap + rowGap);
  const plotW = W - labelW - pctW - 8;
  let marks = "";
  rows.forEach((s, i) => {
    const y0 = top + i * (2 * barH + pairGap + rowGap);
    const draw = (sum, y, tag) => {
      const parts = [
        { v: sum.code / sum.ins, c: "var(--s-code)", n: "code" },
        { v: sum.docs / sum.ins, c: "var(--s-docs)", n: "docs" },
        { v: sum.other / sum.ins, c: "var(--s-other)", n: "other" },
      ];
      let xx = labelW; let out = "";
      for (const p of parts) {
        const w = Math.max(0, p.v * plotW - 2);
        out += '<rect x="' + xx + '" y="' + y + '" width="' + w + '" height="' + barH + '" rx="2" fill="' + p.c + '" ' +
          'data-tip="' + esc(s.team.name + " \u00b7 " + tag + " \u00b7 " + p.n + " " + (p.v * 100).toFixed(0) + "% of " + fmt0(sum.ins) + " inserted lines \u00b7 SYNTHETIC") + '"></rect>';
        xx += p.v * plotW;
      }
      out += '<text x="' + (labelW - 8) + '" y="' + (y + barH - 3) + '" text-anchor="end" font-size="9.5" font-family="IBM Plex Mono, monospace" fill="var(--muted)">' + tag + "</text>";
      return out;
    };
    marks += '<text x="0" y="' + (y0 + barH + 1) + '" font-size="12" fill="var(--ink)" font-weight="' + (s === mixShifted ? 600 : 400) + '">' + esc(s.team.name) + "</text>" +
      draw(s.prior, y0, "prior") + draw(s.cur, y0 + barH + pairGap, "cur") +
      '<text x="' + (W - pctW + 4) + '" y="' + (y0 + barH + 5) + '" font-size="10.5" font-family="IBM Plex Mono, monospace" fill="' + (s.delta > 0 ? "var(--bad)" : "var(--good)") + '">' + pct(s.delta) + "</text>";
  });
  const docsPrior = (mixShifted.prior.docs / mixShifted.prior.ins * 100).toFixed(0);
  const docsCur = (mixShifted.cur.docs / mixShifted.cur.ins * 100).toFixed(0);
  return '<div class="figure"><h2>One \u201cimprovement\u201d is a mix shift, and this panel is the tell</h2>' +
    '<p class="note"><b>' + esc(mixShifted.team.name) + " reads " + pct(mixShifted.delta) + " on the headline while its docs share moved " +
    docsPrior + "% \u2192 " + docsCur + "%.</b> Cheaper lines, not cheaper work. A yield delta only counts when the mix underneath it held still \u2014 which is why the per-area ratios are never shown alone.</p>" +
    '<svg viewBox="0 0 ' + W + " " + H + '" aria-label="insertion mix by team, prior versus current window">' + marks + "</svg>" +
    '<div class="legend">' +
      '<span class="key"><span class="swatch" style="background:var(--s-code)"></span>code</span>' +
      '<span class="key"><span class="swatch" style="background:var(--s-docs)"></span>docs</span>' +
      '<span class="key"><span class="swatch" style="background:var(--s-other)"></span>other</span>' +
      '<span class="key"><span class="chip chip-synth">SYNTHETIC</span></span>' +
    "</div></div>";
}

/* =====================================================================
   Team view: the leaf ledger, per day. Real for Agent Yield.
   ===================================================================== */
function renderTeam(node) {
  const shown = node.synthetic ? node.days.slice(-28) : node.days;
  const total = sumDays(shown);
  let html = crumbsHTML() + scopeHTML(node);

  const first = shown[0], last = shown[shown.length - 1];
  const firstY = dayY(first), lastY = dayY(last);
  const dayDelta = firstY && lastY ? lastY / firstY : null;

  html += '<div class="tiles">' +
    tile("$ per 1,000 inserted lines, " + shown.length + " days " + chip(node), usd(usdPerKIns(total)), true,
      "any/code/docs " + tripleUSD(total), true) +
    tile("list-price equivalent " + chip(node), usd(total.dollars), false,
      esc(fmt0(total.calls)) + " calls \u00b7 " + esc(fmt0(total.tokens)) + " raw tokens", true) +
    tile("commits " + chip(node), fmt0(total.commits), false,
      usd(usdPerCommit(total)) + " per commit") +
    tile("inserted lines " + chip(node), fmt0(total.ins), false,
      "code " + esc(fmt0(total.code)) + " \u00b7 docs " + esc(fmt0(total.docs)) + " \u00b7 other " + esc(fmt0(total.other))) +
    "</div>";

  html += '<div class="figure-grid">';
  html += figDayColumns(node, shown, dayDelta);
  html += figDayMix(node, shown);
  html += "</div>";

  // per-day ledger
  html += '<div class="section-h">The ledger, day by day</div>' +
    '<p class="section-sub">Every figure above is recomputable from this table. $/1k ins any/code/docs is one rendered triple; the halves have no column of their own. ' +
    "Raw tokens are carried so the dollar column can be checked against them, and their ratio is in the secondary table below. " +
    'A day chipped <span class="chip chip-part">PARTIAL</span> had not ended when the leaf was captured: every figure on that row is a floor, ' +
    "and it is in the rollups above unmarked, because excluding it would be a different silence.</p>";
  html += '<div class="tblwrap"><table><thead><tr>' +
    "<th>day</th><th>$</th><th>tokens</th><th>calls</th><th>commits</th><th>code</th><th>docs</th><th>other</th>" +
    "<th>$/1k ins any/code/docs</th><th>main ctx/call</th><th>sub ctx/call</th><th>cost bands</th>" +
    "</tr></thead><tbody>";
  for (const d of shown.slice().reverse()) {
    const s = sumDays([d]);
    html += "<tr><td>" + esc(d.day) + dayChip(d) + "</td>" +
      "<td>" + usd(d.dollars) + "</td>" +
      "<td>" + fmt0(d.tokens) + "</td><td>" + fmt0(d.calls) + "</td><td>" + fmt0(d.commits) + "</td>" +
      "<td>" + fmt0(d.code) + "</td><td>" + fmt0(d.docs) + "</td><td>" + fmt0(d.other) + "</td>" +
      "<td><b>" + tripleUSD(s) + "</b></td>" +
      "<td>" + fmt0(d.mainCtx) + "</td><td>" + fmt0(d.subCtx) + "</td>" +
      "<td>" + d.bands.map((b) => b + "%").join("/") + "</td></tr>";
  }
  html += "</tbody></table></div>" + bandLegend();

  // machines
  html += '<div class="section-h">Machines under this team</div>';
  if (node.synthetic) {
    html += '<p class="section-sub"><span class="chip chip-synth">SYNTHETIC</span> This team is generated and carries no machine ledger. ' +
      "The grain below days exists only where a corpus exists; inventing machines here would dress a scaffold as a measurement.</p>";
  } else {
    html += '<div class="tblwrap"><table><thead><tr><th>machine</th><th>data</th><th>$</th><th>commits</th><th>$/1k ins</th></tr></thead><tbody>';
    for (const m of REAL_MACHINES) {
      if (m.real) {
        html += '<tr><td>' + esc(m.name) + '</td><td><span class="chip chip-real">REAL</span></td>' +
          "<td>" + usd(total.dollars) + "</td><td>" + fmt0(total.commits) + "</td><td><b>" + usd(usdPerKIns(total)) + "</b></td></tr>";
      } else {
        html += '<tr><td>' + esc(m.name) + '</td><td><span class="chip chip-unsc">UNSCORABLE</span></td>' +
          '<td colspan="3" style="text-align:left;color:var(--ink-2);white-space:normal">' + esc(m.unscorable) + "</td></tr>";
      }
    }
    html += "</tbody></table></div>";
    html += '<p class="bandnote">UNSCORABLE is not a dash and not a zero: this view cannot compute the number, and a plausible substitute would be the fifth defect in a row that failed in the reassuring direction.</p>';
  }

  // what changed (real team only)
  if (!node.synthetic && dayDelta != null) {
    html += '<div class="section-h">What changed between the two days</div>' +
      '<p class="section-sub"><b>' + usdText(firstY) + " \u2192 " + usdText(lastY) + " per 1,000 inserted lines, " +
      dayDelta.toFixed(2) + "x worse in one day \u2014 and one day is not a verdict.</b> " +
      "The first day ran " + esc(fmt0(first.calls)) + " calls; the second ran " + esc(fmt0(last.calls)) +
      // Asked of the data, not asserted: this sentence used to say the second
      // day was still running, and would have gone on saying it after the day
      // closed. `partial` is the fact; the prose reads it. (#73, #74's lesson.)
      (last.partial ? " and had not ended when this leaf was captured, so every figure on it is a floor. "
                    : ". ") +
      "A day that runs six experiments and an audit is not the same task as the day before it. " +
      "The number is real; the comparison needs more days before it means anything.</p>";
  }
  html += secondaryTokens(shown.slice().reverse().map((d) => [d.day, sumDays([d])])
    .concat([[node.name + ", all " + shown.length + " days", total]]));
  return html;
}
function dayY(d) { return usdPerKIns(sumDays([d])); }

function figDayColumns(node, days, dayDelta) {
  const W = 640, H = 220, padL = 58, padR = 12, padT = 14, padB = 30;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const vals = days.map(dayY);
  const maxV = niceMax(Math.max(...vals.filter((v) => v != null)));
  const n = days.length;
  const slot = plotW / n;
  const colW = Math.min(24, Math.max(6, slot - 2));
  let grid = "";
  for (let g = 0; g <= 4; g++) {
    const v = maxV * g / 4, yy = padT + (1 - g / 4) * plotH;
    grid += '<line x1="' + padL + '" y1="' + yy + '" x2="' + (W - padR) + '" y2="' + yy + '" stroke="var(--grid)" stroke-width="1"></line>' +
      '<text x="' + (padL - 8) + '" y="' + (yy + 4) + '" text-anchor="end" font-size="10.5" font-family="IBM Plex Mono, monospace" fill="var(--muted)">' + usdAxis(v) + "</text>";
  }
  let marks = "";
  days.forEach((d, i) => {
    const v = vals[i];
    if (v == null) return;
    const h = v / maxV * plotH;
    const x = padL + i * slot + (slot - colW) / 2;
    const y = padT + plotH - h;
    const s = sumDays([d]);
    marks += '<g data-tip="' + esc(d.day + "\u2007" + usdText(v) + " per 1,000 inserted lines \u00b7 any/code/docs " + tripleUSDText(s) +
        " \u00b7 " + usdText(d.dollars) + " \u00b7 " + fmt0(d.tokens) + " raw tokens \u00b7 " + fmt0(d.commits) + " commits" + (node.synthetic ? " \u00b7 SYNTHETIC" : "")) + '">' +
      '<rect x="' + (padL + i * slot) + '" y="' + padT + '" width="' + slot + '" height="' + plotH + '" fill="transparent"></rect>' +
      '<path d="' + roundTop(x, y, colW, h, 4) + '" fill="var(--accent)"' + (node.synthetic ? ' opacity="0.55"' : "") + "></path>";
    if (n <= 4 || i === n - 1 || v === Math.max(...vals)) {
      marks += '<text x="' + (x + colW / 2) + '" y="' + (y - 6) + '" text-anchor="middle" font-size="11" fill="var(--ink)" font-weight="600">' + esc(usdText(v)) + "</text>";
    }
    marks += "</g>";
    if (n <= 8 || i % 7 === 0 || i === n - 1) {
      marks += '<text x="' + (x + colW / 2) + '" y="' + (H - 8) + '" text-anchor="middle" font-size="9.5" font-family="IBM Plex Mono, monospace" fill="var(--muted)">' + d.day.slice(5) + "</text>";
    }
  });
  const head = node.synthetic
    ? "Dollars per 1,000 inserted lines, day by day"
    : "Two days of corpus, and the second cost " + dayDelta.toFixed(2) + "x the first per line";
  const note = node.synthetic
    ? "<b>Every column is generated.</b> The shape is the point: this is what the leaf grain looks like when a corpus exists."
    : "<b>" + usdText(vals[0]) + " \u2192 " + usdText(vals[vals.length - 1]) + " per 1,000 inserted lines.</b> Whole-day ratio, in list-price equivalents; the decomposition rides the tooltip and the ledger as one triple.";
  return '<div class="figure"><h2>' + esc(head) + "</h2>" +
    '<p class="note">' + note + "</p>" +
    '<svg viewBox="0 0 ' + W + " " + H + '" aria-label="list-price dollars per 1,000 inserted lines per day">' + grid + marks + "</svg></div>";
}

function figDayMix(node, days) {
  const W = 640, H = 220, padL = 58, padR = 12, padT = 14, padB = 30;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const maxV = niceMax(Math.max(...days.map((d) => d.code + d.docs + d.other)));
  const n = days.length;
  const slot = plotW / n;
  const colW = Math.min(24, Math.max(6, slot - 2));
  let grid = "";
  for (let g = 0; g <= 4; g++) {
    const v = maxV * g / 4, yy = padT + (1 - g / 4) * plotH;
    grid += '<line x1="' + padL + '" y1="' + yy + '" x2="' + (W - padR) + '" y2="' + yy + '" stroke="var(--grid)" stroke-width="1"></line>' +
      '<text x="' + (padL - 8) + '" y="' + (yy + 4) + '" text-anchor="end" font-size="10.5" font-family="IBM Plex Mono, monospace" fill="var(--muted)">' + fmt0(v) + "</text>";
  }
  let marks = "";
  days.forEach((d, i) => {
    const x = padL + i * slot + (slot - colW) / 2;
    let yy = padT + plotH;
    const parts = [
      { v: d.code, c: "var(--s-code)", n: "code" },
      { v: d.docs, c: "var(--s-docs)", n: "docs" },
      { v: d.other, c: "var(--s-other)", n: "other" },
    ];
    marks += '<g data-tip="' + esc(d.day + "\u2007code " + fmt0(d.code) + " \u00b7 docs " + fmt0(d.docs) + " \u00b7 other " + fmt0(d.other) +
      " inserted lines" + (node.synthetic ? " \u00b7 SYNTHETIC" : "")) + '">' +
      '<rect x="' + (padL + i * slot) + '" y="' + padT + '" width="' + slot + '" height="' + plotH + '" fill="transparent"></rect>';
    for (const p of parts) {
      const h = Math.max(0, p.v / maxV * plotH - 2);
      yy -= p.v / maxV * plotH;
      marks += '<rect x="' + x + '" y="' + yy + '" width="' + colW + '" height="' + h + '" rx="2" fill="' + p.c + '"' + (node.synthetic ? ' opacity="0.7"' : "") + "></rect>";
    }
    marks += "</g>";
    if (n <= 8 || i % 7 === 0 || i === n - 1) {
      marks += '<text x="' + (x + colW / 2) + '" y="' + (H - 8) + '" text-anchor="middle" font-size="9.5" font-family="IBM Plex Mono, monospace" fill="var(--muted)">' + d.day.slice(5) + "</text>";
    }
  });
  return '<div class="figure"><h2>What kind of lines the days shipped</h2>' +
    '<p class="note"><b>The denominator\u2019s composition, in counts.</b> A yield move that arrives with a mix move is a mix story first; this panel is how a reader checks before believing the column chart.</p>' +
    '<svg viewBox="0 0 ' + W + " " + H + '" aria-label="inserted lines per day by kind">' + grid + marks + "</svg>" +
    '<div class="legend">' +
      '<span class="key"><span class="swatch" style="background:var(--s-code)"></span>code</span>' +
      '<span class="key"><span class="swatch" style="background:var(--s-docs)"></span>docs</span>' +
      '<span class="key"><span class="swatch" style="background:var(--s-other)"></span>other</span>' +
    "</div></div>";
}

/* =====================================================================
   Render + events
   ===================================================================== */
function render() {
  const node = nodeAt(PATH);
  const app = document.getElementById("app");
  hideTip();
  app.innerHTML = node.children ? renderRollup(node) : renderTeam(node);

  app.querySelectorAll("[data-crumb]").forEach((b) =>
    b.addEventListener("click", () => go(PATH.slice(0, Number(b.dataset.crumb) + 1))));
  app.querySelectorAll("[data-team]").forEach((el) => {
    const open = () => go(PATH.concat(el.dataset.team));
    el.addEventListener("click", open);
    el.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); } });
  });
  app.querySelectorAll("[data-tip]").forEach((el) => {
    el.addEventListener("pointermove", (e) => {
      const parts = el.dataset.tip.split("\u2007");
      showTip(e, tipRow(null, parts.length > 1 ? parts[1] : parts[0], ""), parts.length > 1 ? parts[0] : "");
    });
    el.addEventListener("pointerleave", hideTip);
    if (el.hasAttribute("tabindex")) {
      el.addEventListener("focus", () => {
        const r = el.getBoundingClientRect();
        showTip({ clientX: r.left + r.width / 2, clientY: r.top }, tipRow(null, el.dataset.tip.replace("\u2007", " \u00b7 "), ""), "");
      });
      el.addEventListener("blur", hideTip);
    }
  });

  // crosshair on the weekly trend
  const svg = document.getElementById("trendSvg");
  if (svg && window.__trend) {
    const { series, weeks, x, padL, plotW, outlierTeam } = window.__trend;
    const xline = svg.querySelector("#trendX");
    const hover = svg.querySelector("#trendHover");
    hover.addEventListener("pointermove", (e) => {
      const rect = svg.getBoundingClientRect();
      const scale = 640 / rect.width;
      const px = (e.clientX - rect.left) * scale;
      let idx = Math.round((px - padL) / plotW * 7);
      idx = Math.max(0, Math.min(7, idx));
      const cx = x(idx);
      xline.setAttribute("x1", cx); xline.setAttribute("x2", cx);
      xline.style.display = "block";
      const ranked = series.slice().sort((a, b) => b.pts[idx] - a.pts[idx]);
      let rows = "";
      for (const s of ranked) {
        const color = s.team === outlierTeam
          ? getComputedStyle(document.documentElement).getPropertyValue("--accent")
          : getComputedStyle(document.documentElement).getPropertyValue("--context-line");
        rows += tipRow(color, usdText(s.pts[idx]), s.team.name);
      }
      showTip(e, rows, "week of " + dayISO(weeks[idx][0]) + " \u00b7 $/1k ins \u00b7 SYNTHETIC");
    });
    hover.addEventListener("pointerleave", () => { xline.style.display = "none"; hideTip(); });
  }
}
render();
</script>
